<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 120 775 520" role="img" aria-labelledby="logo-title">
  <title id="logo-title">SpatialForge 3D</title>
  <defs>
    <linearGradient id="sf-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="sf-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="sf-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f6ff" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="sf-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Halo -->
  <circle cx="567.5" cy="380" r="230" fill="url(#sf-halo)" />

  <!-- Tactical Outer Frame: Segmented Precision Hexagon & Reticle Bezel -->
  <g id="outer_frame" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.85">
    <!-- Outer Octagonal / Hexagonal Brackets -->
    <path d="M 387.5 276 L 477.5 224 L 657.5 224 L 747.5 276" stroke="#00f6ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 747.5 484 L 657.5 536 L 477.5 536 L 387.5 484" stroke="#00f6ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 367.5 310 L 367.5 450" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <path d="M 767.5 310 L 767.5 450" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

    <!-- Precision Telemetry Corner Brackets -->
    <path d="M 347.5 260 L 327.5 260 L 327.5 290" stroke="#00f6ff" stroke-width="2.5"/>
    <path d="M 787.5 260 L 807.5 260 L 807.5 290" stroke="#00f6ff" stroke-width="2.5"/>
    <path d="M 347.5 500 L 327.5 500 L 327.5 470" stroke="#00f6ff" stroke-width="2.5"/>
    <path d="M 787.5 500 L 807.5 500 L 807.5 470" stroke="#00f6ff" stroke-width="2.5"/>

    <!-- Calibrated Bezel Ring -->
    <circle cx="567.5" cy="380" r="190" stroke="#1e293b" stroke-width="6"/>
    <circle cx="567.5" cy="380" r="190" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 12"/>
    <circle cx="567.5" cy="380" r="172" stroke="#00f6ff" stroke-width="1.5" opacity="0.4"/>

    <!-- Cardinal Coordinate Ticks -->
    <line x1="567.5" y1="175" x2="567.5" y2="195" stroke="#00f6ff" stroke-width="3"/>
    <line x1="567.5" y1="565" x2="567.5" y2="585" stroke="#00f6ff" stroke-width="3"/>
    <line x1="362.5" y1="380" x2="382.5" y2="380" stroke="#00f6ff" stroke-width="3"/>
    <line x1="752.5" y1="380" x2="772.5" y2="380" stroke="#00f6ff" stroke-width="3"/>

    <!-- 45-degree sub-ticks -->
    <line x1="433" y1="245" x2="447" y2="259" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <line x1="702" y1="245" x2="688" y2="259" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <line x1="433" y1="515" x2="447" y2="501" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <line x1="702" y1="515" x2="688" y2="501" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Interactive Gaze Element 1: Orbital Gyroscope Cage (id="globe_cage") -->
  <g id="globe_cage">
    <!-- Horizontal Orbital Ring (Tilted Ellipse) -->
    <ellipse cx="567.5" cy="380" rx="145" ry="52" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.75" transform="rotate(-15 567.5 380)"/>
    <ellipse cx="567.5" cy="380" rx="145" ry="52" fill="none" stroke="#00f6ff" stroke-width="3.5" stroke-dasharray="24 160" opacity="0.9" transform="rotate(-15 567.5 380)"/>

    <!-- Secondary Polar Orbital Ring -->
    <ellipse cx="567.5" cy="380" rx="52" ry="145" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.65" transform="rotate(-25 567.5 380)"/>
    <ellipse cx="567.5" cy="380" rx="52" ry="145" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="30 180" opacity="0.85" transform="rotate(-25 567.5 380)"/>

    <!-- Telemetry Crosshair Grid -->
    <line x1="477.5" y1="380" x2="657.5" y2="380" stroke="#00f6ff" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.5"/>
    <line x1="567.5" y1="290" x2="567.5" y2="470" stroke="#00f6ff" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.5"/>
    <circle cx="567.5" cy="380" r="105" fill="none" stroke="#00f6ff" stroke-width="1" stroke-dasharray="6 8" opacity="0.4"/>
  </g>

  <!-- Interactive Gaze Element 2: SpatialForge 3D Isometric Core (id="globe") -->
  <g id="globe" filter="url(#sf-bloom)">
    <!-- Central Forge Core: Isometric Faceted Spatial Prism -->
    <!-- Top Face -->
    <polygon points="567.5,305 637.5,345 567.5,385 497.5,345" fill="#38bdf8" fill-opacity="0.85" stroke="#00f6ff" stroke-width="3" stroke-linejoin="round"/>

    <!-- Left Face -->
    <polygon points="497.5,345 567.5,385 567.5,465 497.5,425" fill="#0284c7" fill-opacity="0.9" stroke="#00f6ff" stroke-width="3" stroke-linejoin="round"/>

    <!-- Right Face -->
    <polygon points="567.5,385 637.5,345 637.5,425 567.5,465" fill="#0369a1" fill-opacity="0.95" stroke="#00f6ff" stroke-width="3" stroke-linejoin="round"/>

    <!-- Internal Facet Triangles / Forge Geometry -->
    <line x1="567.5" y1="385" x2="567.5" y2="305" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <line x1="567.5" y1="385" x2="497.5" y2="425" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <line x1="567.5" y1="385" x2="637.5" y2="425" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

    <!-- Center Coordinate Core Node -->
    <circle cx="567.5" cy="385" r="7" fill="#ffffff" stroke="#00f6ff" stroke-width="2.5"/>

    <!-- Apex Telemetry Beacons -->
    <circle cx="567.5" cy="305" r="4.5" fill="#00f6ff"/>
    <circle cx="637.5" cy="345" r="4.5" fill="#00f6ff"/>
    <circle cx="497.5" cy="345" r="4.5" fill="#00f6ff"/>
    <circle cx="567.5" cy="465" r="4.5" fill="#00f6ff"/>
    <circle cx="497.5" cy="425" r="4" fill="#38bdf8"/>
    <circle cx="637.5" cy="425" r="4" fill="#38bdf8"/>
  </g>
</svg>
