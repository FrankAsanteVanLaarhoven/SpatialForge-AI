version: '3.8'

services:
  spatialforge-db:
    image: postgis/postgis:16-3.4
    container_name: spatialforge-postgis
    environment:
      POSTGRES_DB: spatialforge
      POSTGRES_USER: spatialforge_admin
      POSTGRES_PASSWORD: spatialforge_secure_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./storage/postgres/init_postgis.sql:/docker-entrypoint-initdb.d/01_init_postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spatialforge_admin -d spatialforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  spatialforge-redis:
    image: redis:7.2-alpine
    container_name: spatialforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
